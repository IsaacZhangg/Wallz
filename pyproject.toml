[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallzero"
version = "0.1.0"
description = "A rule-only AlphaZero engine for full-size 9x9 Quoridor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "torch>=2.5",
]

[project.scripts]
wallzero = "wallzero.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
  "ty>=0.0.1a16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wallzero"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.environment]
python-version = "3.11"

